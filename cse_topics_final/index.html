 $("chips").innerHTML="";
 ["all",...keys].forEach(k=>{const b=document.createElement("button");
  b.className="chip"+(k===cur?" on":"");
  b.innerHTML=(k==="all"?"🔀 All subjects":NAMES[k]||k)+"<small>"+pool(k).length+"</small>";
  b.onclick=()=>{cur=k;chips();left()};$("chips").appendChild(b)});
}

function pick(){
 let p=pool(cur);
 if($("nr").checked){let f=p.filter(([s,t])=>!used[key(s,t)]);
  if(!f.length){p.forEach(([s,t])=>delete used[key(s,t)]);f=p;}p=f;}
 if(p.length>1)p=p.filter(([s,t])=>t!==last)||p;
