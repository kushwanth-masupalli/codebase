apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: medicare

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: therobust18/medicare_backend:latest

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: backend-config